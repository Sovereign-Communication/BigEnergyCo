name: Deploy to GitHub Pages

# Publishes an explicit allowlist of public site files ONLY.
# Nothing else in the repo — scripts, docs, backups, binaries — may leak
# into the deployed site, even if accidentally committed.

on:
  push:
    branches: [main]
    # A push that cannot change the published artifact should not spend a
    # deploy — and because `Verify staging` fires on this workflow completing,
    # skipping here also skips verifying an artifact that is provably
    # unchanged. One docs-only ledger commit used to cost a build, a publish
    # and a full browser smoke for byte-identical output.
    #
    # This is a DENYLIST on purpose: anything not named here still deploys, so
    # a new deployable directory can never be skipped by omission. It is
    # deliberately NOT a list of deployable paths, because the allowlist in
    # scripts/deploy-pages-local.mjs is the single source of truth for what
    # ships; tests/ci-resilience.test.mjs checks every entry below against that
    # allowlist, so an entry that ever covers a deployable file fails the suite
    # instead of quietly skipping a release.
    paths-ignore:
      - "docs/**"
      - ".github/**"
      - "scripts/**"
      - "tests/**"
      - ".githooks/**"
      - "worker/**"
      - "**/*.md"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Measured on 2026-09-19: ~13s (build + upload + publish). Bounded like
    # every other job so a hung step cannot hold a runner for the 6-hour
    # default; `Verify staging` waits on this workflow, so a hang here would
    # stall the gate behind it too.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select deployable files
        # Single source of truth: scripts/deploy-pages-local.mjs --check builds
        # the allowlisted staging dir without pushing. Do NOT hand-maintain a
        # second file list here — extend the ALLOWLIST in that script instead.
        run: node scripts/deploy-pages-local.mjs --check --stage _pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
