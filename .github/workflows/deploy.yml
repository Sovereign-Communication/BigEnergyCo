name: Deploy to GitHub Pages

# Publishes an explicit allowlist of public site files ONLY.
# Nothing else in the repo — scripts, docs, backups, binaries — may leak
# into the deployed site, even if accidentally committed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select deployable files
        # Single source of truth: scripts/deploy-pages-local.mjs --check builds
        # the allowlisted staging dir without pushing. Do NOT hand-maintain a
        # second file list here — extend the ALLOWLIST in that script instead.
        run: node scripts/deploy-pages-local.mjs --check --stage _pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
