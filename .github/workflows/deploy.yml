name: Deploy to GitHub Pages

# Publishes an explicit allowlist of public site files ONLY.
# Nothing else in the repo — scripts, docs, backups, binaries — may leak
# into the deployed site, even if accidentally committed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select deployable files
        run: |
          mkdir -p _pages/blog/diy-vs-prebuilt-sodium-ion-lifepo4-battery-storage
          mkdir -p _pages/blog/off-grid-vs-grid-tie-payback
          cp index.html index-freenet.html 404.html robots.txt sitemap.xml rss.xml sw.js manifest.webmanifest _pages/
          cp blog/index.html _pages/blog/
          cp "blog/diy-vs-prebuilt-sodium-ion-lifepo4-battery-storage/index.html" "_pages/blog/diy-vs-prebuilt-sodium-ion-lifepo4-battery-storage/"
          cp "blog/off-grid-vs-grid-tie-payback/index.html" "_pages/blog/off-grid-vs-grid-tie-payback/"
          cp -r assets _pages/assets
          cp _headers _pages/ 2>/dev/null || true
          cp _redirects _pages/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
