name: Tests

on:
  push:
    branches: [main, "phase2/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check worker and engine
        run: |
          node --check worker/index.js
          node --check assets/js/sizing/engine.js
          node --check assets/js/sizing/nasa.js
          node --check assets/js/sizing/sizing-worker.js
          node --check assets/js/sizing/ui.js
          node --check assets/js/sizing/pricing.js
          node --check assets/js/sizing/money.js
          node --check assets/js/sizing/run.js
          node --check assets/js/sizing/frontier.js
          node --check assets/js/sizing/frontier-chart.js
          node --check assets/js/shared/locales.js

      - name: Validate SEO & encoding
        run: |
          node scripts/validate-jsonld.mjs
          node scripts/check-chars.mjs
          node scripts/check-seo.mjs

      - name: Secret-scan tracked files
        run: |
          ! git grep -nE "oauth_toke[n]|BEGIN [A-Z ]*PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|sk-live-[0-9A-Za-z]{10,}" -- . ':!*.lock' || (echo "Possible secret in tracked files" && exit 1)

      - name: Check deploy allowlist
        run: node scripts/deploy-pages-local.mjs --check

      - name: Unit tests (offline)
        run: node --test

      # Live-API validation is manual (network): node scripts/validate-live.mjs
