name: Tests

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check all JS
        run: node scripts/check-syntax.mjs

      - name: Validate SEO & encoding
        run: |
          node scripts/validate-jsonld.mjs
          node scripts/check-chars.mjs
          node scripts/check-seo.mjs
          node scripts/bump-asset-tokens.mjs --check

      - name: Secret-scan tracked files
        run: |
          ! git grep -nE "oauth_toke[n]|BEGIN [A-Z ]*PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|sk-live-[0-9A-Za-z]{10,}" -- . ':!*.lock' || (echo "Possible secret in tracked files" && exit 1)

      - name: Check deploy allowlist
        run: node scripts/deploy-pages-local.mjs --check

      - name: Unit tests (offline)
        run: npm test

      # Live-API validation is manual (network): node scripts/validate-live.mjs
