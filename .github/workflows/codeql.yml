name: CodeQL

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  schedule:
    - cron: "0 9 * * 4"

# One group per branch, newest run wins — same-commit push+PR duplicates
# and superseded-branch runs no longer pile onto saturated hosted runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
