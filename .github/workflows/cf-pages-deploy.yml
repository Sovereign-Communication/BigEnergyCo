name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (staging or production)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build deploy artifact
        run: node scripts/deploy-pages-local.mjs --check --stage _pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # staging -> preview branch (staging.bigenergyco.pages.dev);
          # production -> main branch (bigenergyco.pages.dev + freeoffgridcalculator.com)
          command: pages deploy _pages --project-name=bigenergyco --branch=${{ inputs.target == 'production' && 'main' || 'staging' }}
