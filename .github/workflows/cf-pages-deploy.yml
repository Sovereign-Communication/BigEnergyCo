name: Deploy to Cloudflare Pages

# Canonical deployment model (owner directive 2026-10-21):
# - https://freeoffgridcalculator.com/ is the full production site.
# - https://bigenergyco.pages.dev/ is the production site (NOT staging).
# - There is no staging deployment. Both production URLs serve the main
#   branch; this workflow deploys main to both. If a staging environment
#   ever becomes necessary, it needs an explicit owner decision first —
#   do not reintroduce a staging target without one.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build deploy artifact
        run: node scripts/deploy-pages-local.mjs --check --stage _pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # main branch serves both production surfaces:
          # bigenergyco.pages.dev + freeoffgridcalculator.com
          command: pages deploy _pages --project-name=bigenergyco --branch=main
